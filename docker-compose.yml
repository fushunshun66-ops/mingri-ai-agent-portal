version: "3.9"

services:
  # ── 数据库 ──
  postgres:
    image: pgvector/pgvector:pg14
    container_name: portal-postgres
    environment:
      POSTGRES_DB: agent_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: change_me_in_prod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d agent_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: portal-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── API 服务 ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 对象存储 ──
  minio:
    image: minio/minio:latest
    container_name: portal-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
